              </div>
              <span class="text-[10px] text-stone-400 dark:text-white/40 mt-1 mx-9">${msg.time || ''}</span>
            </div>
          `).join('');

        // Рендер аватарок участников
        const membersHtml = participants.map(p => `
          <img src="${p.avatar}" class="w-10 h-10 rounded-full border-2 border-white dark:border-stone-850 ring-1 ring-stone-200 dark:ring-white/10 object-cover">
        `).join('');

        // -----------------------------------------------------------------
        // ОСНОВНОЙ HTML ШАБЛОН ДЕТАЛЬНОГО ПРОСМОТРА
        // -----------------------------------------------------------------
        content.innerHTML = `
          <div class="h-full flex flex-col lg:flex-row bg-white dark:bg-stone-850 w-full overflow-y-auto lg:overflow-hidden">
             
            <div class="w-full lg:w-[55%] relative flex flex-col h-auto lg:h-full lg:overflow-y-auto hide-scroll bg-stone-50 dark:bg-black/10 shrink-0">
              <div class="relative h-64 lg:h-80 shrink-0">
                <img src="${image}" class="w-full h-full object-cover">
                <button onclick="UI.closeDetail()"
                        class="absolute top-4 left-4 w-10 h-10 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center text-white hover:bg-white hover:text-stone-900 transition-all z-10">
                  <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="absolute bottom-0 inset-x-0 h-24 bg-gradient-to-t from-stone-50 dark:from-stone-850 to-transparent"></div>
              </div>

              <div class="px-6 lg:px-10 pb-6 lg:pb-10 -mt-6 relative z-10">
                <div class="bg-white dark:bg-white/5 p-5 rounded-3xl shadow-sm border border-stone-100 dark:border-white/10 mb-4">
                  <div class="flex justify-between items-start mb-3">
                    <div class="min-w-0 pr-4">
                      <span class="text-brand-500 font-extrabold text-xs uppercase tracking-wider mb-1 block">${this.escapeHTML(date)}</span>
                      <h2 class="text-xl sm:text-2xl lg:text-3xl font-extrabold text-stone-900 dark:text-white leading-tight">${this.escapeHTML(title)}</h2>
                    </div>
                    <div class="flex flex-col items-center gap-1">
                      <button onclick="app.toggleLike('${type}', ${id})"
                              class="w-10 h-10 rounded-2xl flex items-center justify-center transition-all
                              ${likes > 0 ? 'bg-brand-50 text-brand-500 dark:bg-white/10' : 'bg-stone-100 text-stone-400 hover:text-brand-500 dark:bg-white/10 dark:text-white/70'}">
                        <i class="fa-solid fa-heart"></i>
                      </button>
                    </div>
                  </div>
                   
                  <div class="flex items-start gap-2 text-stone-600 dark:text-white/70 mb-4 text-sm">
                    <i class="fa-solid fa-location-dot mt-1 text-brand-500"></i>
                    <p class="font-bold">${this.escapeHTML(location)}</p>
                  </div>
                   
                  <p class="text-stone-600 dark:text-white/70 leading-relaxed text-sm lg:text-base mb-4">
                    ${this.escapeHTML(desc || '')}
                  </p>

                  <div class="flex items-center justify-between p-3 bg-stone-50 dark:bg-black/10 rounded-2xl border border-stone-100 dark:border-white/10">
                    <div class="flex items-center gap-3">
                      <div class="flex -space-x-3">${membersHtml}</div>
                      <span class="text-xs font-bold text-stone-500 dark:text-white/60">${participants.length} ${type==='event' ? 'идут' : 'в гильдии'}</span>
                    </div>
                    <button onclick="app.toggleSave('${type}', ${id})"
                            class="w-9 h-9 rounded-xl bg-white dark:bg-white/5 border border-stone-100 dark:border-white/10 flex items-center justify-center hover:bg-stone-50 dark:hover:bg-white/10 transition">
                      <i class="fa-solid fa-bookmark ${app.saved.has(`${type}:${id}`) ? 'text-brand-500' : 'text-stone-400 dark:text-white/60'}"></i>
                    </button>
                  </div>
                </div>

                <button onclick="app.join('${type}', ${id})"
                        class="w-full py-3.5 rounded-2xl font-extrabold text-base shadow-lg active:scale-[0.99] transition-all mb-2
                               ${isJoined
                                 ? 'bg-stone-100 dark:bg-white/10 text-stone-600 dark:text-white/70 hover:bg-stone-200 dark:hover:bg-white/15'
                                 : 'bg-brand-500 text-white hover:bg-brand-600 shadow-brand-500/25'}">
                  ${isJoined ? (type==='event' ? 'Вы идёте (Отменить)' : 'Вы в гильдии (Выйти)') : (type==='event' ? 'Я пойду!' : 'Вступить')}
                </button>
              </div>
            </div>

            <div class="w-full lg:w-[45%] flex flex-col h-auto lg:h-full bg-white dark:bg-stone-850 border-t lg:border-t-0 lg:border-l border-stone-100 dark:border-white/10 relative z-20">
               
              <div class="hidden lg:flex flex-none px-6 py-3 border-b border-stone-100 dark:border-white/10 items-center justify-between bg-white dark:bg-stone-850 z-10">
                <div>
                  <h3 class="font-extrabold text-base text-stone-800 dark:text-white">Чат</h3>
                  <p class="text-[10px] text-stone-400 dark:text-white/50">Пиши коротко.</p>
                </div>
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
              </div>

              <div class="flex-grow p-4 space-y-3 bg-stone-50/70 dark:bg-black/10 overflow-visible lg:overflow-y-auto" id="detailChat">
                ${chatHtml}
              </div>

              <div class="flex-none p-4 pb-6 sm:pb-4 bg-white dark:bg-stone-850 border-t border-stone-100 dark:border-white/10 relative z-30 sticky bottom-0 lg:static">
                <form onsubmit="event.preventDefault(); UI.sendDetailMessage('${type}', ${id}, this.msg.value); this.reset();"
                      class="relative">
                  <input type="text" name="msg" placeholder="Написать сообщение..." autocomplete="off"
                         class="w-full bg-stone-100 dark:bg-white/10 dark:text-white text-stone-800 placeholder-stone-400 rounded-full py-3.5 pl-5 pr-12 focus:outline-none focus:ring-2 focus:ring-brand-500/50 transition-all font-medium text-sm">
                  <button type="submit"
                          class="absolute right-2 top-2 bottom-2 w-9 h-9 bg-brand-500 rounded-full text-white flex items-center justify-center hover:bg-brand-600 transition-colors shadow-md shadow-brand-500/30">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                  </button>
                </form>
              </div>

            </div>
          </div>
        `;

        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        document.body.style.overflow = 'hidden';
         
        // Скролл вниз только на ПК, на мобилке пусть остается сверху
        if (window.innerWidth >= 1024) {
            const chatEl = document.getElementById('detailChat');
            if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
        }
      },

      closeDetail() {
        const overlay = document.getElementById('detailOverlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
        document.body.style.overflow = '';
        app.currentDetailId = null;
        app.currentDetailType = null;
      },

      sendDetailMessage(type, id, text) {
        app.sendGroupMessage(type, id, text);
      },

      openCreateModal(mode = 'event') {
        if (!app.isLoggedIn) {
          this.toast('Сначала войдите');
          this.openProfileModal();
          return;
        }
        const overlay = document.getElementById('createOverlay');
        const title = document.getElementById('createTitle');
        const form = overlay.querySelector('form');
        form.mode.value = mode;
        title.textContent = mode === 'guild' ? 'Создать гильдию' : 'Создать событие';
        const catRow = form.querySelector('select[name="category"]').closest('div');
        const locRow = form.querySelector('input[name="location"]').closest('div');
        const dateRow = form.querySelector('input[name="date"]').closest('div');
        const priceRow = form.querySelector('select[name="price"]').closest('div');
        catRow.style.display = (mode === 'guild') ? 'none' : '';
        locRow.style.display = (mode === 'guild') ? 'none' : '';
        dateRow.style.display = (mode === 'guild') ? 'none' : '';
        priceRow.style.display = (mode === 'guild') ? 'none' : '';
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      },

      closeCreateModal() {
        const overlay = document.getElementById('createOverlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      },

      submitCreate(e) {
        e.preventDefault();
        const form = e.target;
        const mode = form.mode.value;
        const data = {
          title: form.title.value.trim(),
          category: form.category?.value,
          date: form.date?.value?.trim(),
          location: form.location?.value?.trim(),
          description: form.description.value.trim(),
          price: form.price?.value,
          image: form.image.value.trim()
        };
        if (!data.title) return this.toast('Название пустое');
        if (!data.description) return this.toast('Описание пустое');
        app.create(mode, data);
        form.reset();
      },

      escapeHTML(s) {
        return String(s)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;');
      },

      appendAIMessage(who, text) {
        const hist = document.getElementById('aiHistory');
        const isMe = who === 'user';
        const bubble = document.createElement('div');
        bubble.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} animate-fade-in`;
        bubble.innerHTML = `
          <div class="max-w-[85%] px-4 py-3 rounded-2xl text-sm leading-relaxed shadow-sm
              ${isMe
                ? 'bg-brand-500 text-white rounded-br-none'
                : 'bg-white dark:bg-white/5 text-stone-700 dark:text-white border border-stone-100 dark:border-white/10 rounded-bl-none'}">
            ${this.escapeHTML(text)}
          </div>
        `;
        hist.appendChild(bubble);
        hist.scrollTop = hist.scrollHeight;
      },

      appendAITyping() {
        const hist = document.getElementById('aiHistory');
        const wrap = document.createElement('div');
        wrap.id = 'aiTyping';
        wrap.className = 'flex items-start animate-fade-in';
        wrap.innerHTML = `
          <div class="px-4 py-3 rounded-2xl bg-white dark:bg-white/5 border border-stone-100 dark:border-white/10 text-stone-500 dark:text-white/60 text-sm font-bold">
            <i class="fa-solid fa-spinner fa-spin mr-2"></i>Печатает...
          </div>
        `;
        hist.appendChild(wrap);
        hist.scrollTop = hist.scrollHeight;
      },

      removeAITyping() {
        const el = document.getElementById('aiTyping');
        if (el) el.remove();
      },

      async sendAI(e) {
        e.preventDefault();
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text) return;
        this.appendAIMessage('user', text);
        input.value = '';
        this.appendAITyping();
        const res = await app.askAI(text);
        this.removeAITyping();
        if (res.ok) this.appendAIMessage('bot', res.text);
        else this.appendAIMessage('bot', res.text);
      },

      toggleAuthMode(mode) {
        const login = document.getElementById('profileAuthView');
        const reg = document.getElementById('profileRegisterView');
        const user = document.getElementById('profileUserView');
        user.classList.add('hidden');
        if (mode === 'register') { login.classList.add('hidden'); reg.classList.remove('hidden'); }
        else { reg.classList.add('hidden'); login.classList.remove('hidden'); }
      },

      openProfileModal() {
        const overlay = document.getElementById('profileOverlay');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
        this.renderProfile();
      },

      closeProfileModal() {
        const overlay = document.getElementById('profileOverlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      },

      renderProfile() {
        const navAvatar = document.getElementById('navAvatar');
        navAvatar.src = app.userAvatar;
         
        // Обновляем данные в меню тоже
        const menuName = document.getElementById('menuUserName');
        const menuDesc = document.getElementById('menuUserDesc');
        if(menuName && menuDesc) {
            menuName.textContent = app.isLoggedIn ? app.userName : 'Гость';
            menuDesc.textContent = app.userDesc;
        }

        const auth = document.getElementById('profileAuthView');
        const reg = document.getElementById('profileRegisterView');
        const user = document.getElementById('profileUserView');
        if (!app.isLoggedIn) {
          user.classList.add('hidden');
          reg.classList.add('hidden');
          auth.classList.remove('hidden');
          return;
        }
        auth.classList.add('hidden');
        reg.classList.add('hidden');
        user.classList.remove('hidden');
        document.getElementById('profileAvatar').src = app.userAvatar;
        document.getElementById('profileName').textContent = app.userName;
        document.getElementById('profileDesc').textContent = app.userDesc;
        document.getElementById('lvlText').textContent = `Level ${app.userLevel}`;
        document.getElementById('xpText').textContent = `${app.userXP} XP`;
        const currentLevelStart = (app.userLevel - 1) * 100;
        const pct = Math.max(0, Math.min(100, ((app.userXP - currentLevelStart) / 100) * 100));
        document.getElementById('xpBar').style.width = pct + '%';
        const grid = document.getElementById('badgesGrid');
        grid.innerHTML = '';
        if (!app.badges.length) {
          grid.innerHTML = `
            <div class="col-span-4 text-sm text-stone-500 dark:text-white/60">
              Пока без бейджей. Пора “в люди”.
            </div>`;
          return;
        }
        app.badges.forEach(b => {
          const el = document.createElement('div');
          el.className = 'bg-white dark:bg-white/5 border border-stone-100 dark:border-white/10 rounded-2xl p-3 flex flex-col items-center justify-center';
          el.innerHTML = `
            <div class="text-2xl">${b.icon}</div>
            <div class="text-[10px] mt-2 font-extrabold text-stone-500 dark:text-white/60 text-center">${this.escapeHTML(b.name)}</div>
          `;
          grid.appendChild(el);
        });
      },

      // --- НОВЫЕ ФУНКЦИИ ---
      
      toggleUserMenu() {
        const menu = document.getElementById('userMenuDropdown');
        if(menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            this.renderUserMenu(); // Обновляем состояние меню при открытии
        } else {
            menu.classList.add('hidden');
        }
      },
       
      closeUserMenu() {
        const menu = document.getElementById('userMenuDropdown');
        menu.classList.add('hidden');
      },

      renderUserMenu() {
        const guestView = document.getElementById('menuGuestView');
        const userView = document.getElementById('menuUserView');
        const logoutBlock = document.getElementById('menuLogoutBlock');

        if(app.isLoggedIn) {
            guestView.classList.add('hidden');
            userView.classList.remove('hidden');
            logoutBlock.classList.remove('hidden');
        } else {
            guestView.classList.remove('hidden');
            userView.classList.add('hidden');
            logoutBlock.classList.add('hidden');
        }
      },

      openSettingsModal() {
        const overlay = document.getElementById('settingsOverlay');
        overlay.classList.remove('hidden');
        overlay.classList.add('flex');
      },

      closeSettingsModal() {
        const overlay = document.getElementById('settingsOverlay');
        overlay.classList.add('hidden');
        overlay.classList.remove('flex');
      },

      renderAll() {
        this.renderProfile();
        this.renderEvents();
        this.renderGuilds();
        this.renderSaved();
        if (app.isLoggedIn) {
          document.getElementById('greetingTitle').textContent = `Привет, ${app.userName}! 👋`;
        } else {
          document.getElementById('greetingTitle').textContent = 'Привет! 👋';
        }
      }
    };

    document.addEventListener('click', (e) => {
      const detail = document.getElementById('detailOverlay');
      if (detail.classList.contains('flex') && e.target === detail) UI.closeDetail();
      const create = document.getElementById('createOverlay');
      if (create.classList.contains('flex') && e.target === create) UI.closeCreateModal();
      const profile = document.getElementById('profileOverlay');
      if (profile.classList.contains('flex') && e.target === profile) UI.closeProfileModal();
      const settings = document.getElementById('settingsOverlay');
      if (settings.classList.contains('flex') && e.target === settings) UI.closeSettingsModal();

      // Закрытие меню при клике вне его
      const menuContainer = document.getElementById('userMenuContainer');
      if (menuContainer && !menuContainer.contains(e.target)) {
         UI.closeUserMenu();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      app.init();
      UI.switchTab('events');
    });
  </script>
</body>
</html>
